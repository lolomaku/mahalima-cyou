<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/modal.css"><link rel="stylesheet" href="../css/credits.css"><link rel="stylesheet" href="css/admin.css"></head><body><div class="stars" aria-hidden="true"></div><div class="admin-shell"><section class="admin-login" id="loginScreen"><div class="admin-login__glyph" aria-hidden="true">✦</div><h1 class="admin-login__title">Moderator Sign-in</h1><p class="admin-login__sub">Enter your fanbase's admin password to continue.</p><form id="loginForm"><label class="field"><span class="field__label">Password</span> <input class="field__input" id="loginPassword" type="password" required autocomplete="current-password"></label> <button type="submit" class="btn btn--primary">Sign in</button></form><p class="admin-login__error" id="loginError" hidden></p></section><section class="admin-app" id="appScreen" hidden><header class="admin-header"><div><p class="admin-welcome__eyebrow">Welcome back</p><h1 class="admin-welcome__title" id="welcomeName"></h1><p class="admin-welcome__fanbase" id="welcomeFanbase"></p></div><div class="admin-toolbar"><span class="admin-unsaved" id="unsavedIndicator"></span> <button type="button" class="admin-btn" id="refreshBtn">↻ Refresh</button> <button type="button" class="admin-btn admin-btn--primary" id="saveBtn">💾 Save</button></div></header><nav class="admin-tabs"><button type="button" class="admin-tab is-active" data-tab="pendingPanel">Pending</button> <button type="button" class="admin-tab" data-tab="approvedPanel">Approved</button> <button type="button" class="admin-tab" data-tab="schedulePanel">Schedule</button></nav><div class="admin-panel is-active" id="pendingPanel"><div class="admin-panel__head"><span class="admin-panel__count" id="pendingCount"></span></div><div class="admin-card-grid" id="pendingList"></div><div class="admin-empty" id="pendingEmpty" hidden>No sightings waiting for review.</div></div><div class="admin-panel" id="approvedPanel"><div class="admin-panel__head"><span class="admin-panel__count" id="approvedCount"></span><div class="admin-approved-controls"><input type="search" class="admin-search" id="approvedSearch" placeholder="Search submitter, category, title…"> <select class="admin-sort" id="approvedSort"><option value="date-desc">Date (newest first)</option><option value="date-asc">Date (oldest first)</option><option value="category-asc">Category (A–Z)</option><option value="category-desc">Category (Z–A)</option></select></div></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Title</th><th>Date</th><th>Category</th><th>Submitted by</th><th>Approved by</th><th>Link</th><th></th></tr></thead><tbody id="approvedTableBody"></tbody></table></div><div class="admin-empty" id="approvedEmpty" hidden>No approved sightings yet.</div></div><div class="admin-panel" id="schedulePanel"><div class="admin-panel__head"><span class="admin-panel__count" id="scheduleCount"></span></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Date</th><th>Time</th><th>Place</th><th></th></tr></thead><tbody id="scheduleTableBody"></tbody></table></div><div class="admin-empty" id="scheduleEmpty" hidden>No schedule entries yet.</div><button type="button" class="admin-add-row" id="scheduleAddRow">+ Add row</button></div></section></div><div class="admin-toast" id="adminToast"></div><script type="module" src="js/admin-main.js"></script></body></html>
