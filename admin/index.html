<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><meta name="robots" content="noindex, nofollow"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/modal.css"><link rel="stylesheet" href="../css/credits.css"><link rel="stylesheet" href="../css/addsighting.css"><link rel="stylesheet" href="css/admin.css"></head><body><div class="stars" aria-hidden="true"></div><div class="admin-shell"><section class="admin-login" id="loginScreen"><div class="admin-login__glyph" aria-hidden="true">✦</div><h1 class="admin-login__title">Moderator Sign-in</h1><p class="admin-login__sub">Enter your fanbase's admin password to continue.</p><form id="loginForm"><label class="field"><span class="field__label">Password</span> <input class="field__input" id="loginPassword" type="password" required autocomplete="current-password"></label> <button type="submit" class="btn btn--primary">Sign in</button></form><p class="admin-login__error" id="loginError" hidden></p></section><section class="admin-app" id="appScreen" hidden><header class="admin-header"><div><p class="admin-welcome__eyebrow">Welcome back</p><h1 class="admin-welcome__title" id="welcomeName"></h1><p class="admin-welcome__fanbase" id="welcomeFanbase"></p></div><div class="admin-toolbar"><span class="admin-unsaved" id="unsavedIndicator"></span> <button type="button" class="admin-btn" id="refreshBtn">↻ Refresh</button> <button type="button" class="admin-btn admin-btn--primary" id="saveBtn">💾 Save</button></div></header><nav class="admin-tabs"><button type="button" class="admin-tab is-active" data-tab="pendingPanel">Pending</button> <button type="button" class="admin-tab" data-tab="approvedPanel">Approved</button> <button type="button" class="admin-tab" data-tab="batchPanel">Batch Upload</button></nav><div class="admin-panel is-active" id="pendingPanel"><div class="admin-panel__head"><span class="admin-panel__count" id="pendingCount"></span></div><div class="admin-card-grid" id="pendingList"></div><div class="admin-empty" id="pendingEmpty" hidden>No sightings waiting for review.</div></div><div class="admin-panel" id="approvedPanel"><div class="admin-panel__head"><span class="admin-panel__count" id="approvedCount"></span></div><div class="admin-approved-search"><div class="admin-approved-search__bar"><span class="admin-approved-search__icon" aria-hidden="true">🔍</span> <input type="search" class="admin-search admin-search--approved" id="approvedSearch" placeholder="Search by title, category, or submitter…"> <button type="button" class="admin-btn admin-btn--primary" id="approvedSearchBtn">Search</button> <button type="button" class="admin-btn" id="approvedLoadAllBtn">Load all</button></div><div class="admin-approved-sortlinks" id="approvedSortLinks"><button type="button" class="admin-sortlink is-active" data-sort="date-desc">Newest first</button> <span class="admin-sortlink__sep">·</span> <button type="button" class="admin-sortlink" data-sort="date-asc">Oldest first</button> <span class="admin-sortlink__sep">·</span> <button type="button" class="admin-sortlink" data-sort="category-asc">Category A–Z</button> <span class="admin-sortlink__sep">·</span> <button type="button" class="admin-sortlink" data-sort="category-desc">Category Z–A</button></div></div><div class="admin-card-grid" id="approvedList"></div><div class="admin-empty" id="approvedEmpty">Start typing above to search approved sightings.</div></div><div class="admin-panel" id="batchPanel"><div class="admin-panel__head"><span class="admin-panel__count" id="batchCount"></span></div><div class="admin-table-wrap admin-table-wrap--batch"><table class="admin-table admin-table--batch"><thead><tr><th>Link</th><th>Category</th><th>Date</th><th>Location</th><th>Contributor</th><th></th></tr></thead><tbody id="batchTableBody"></tbody></table></div><button type="button" class="admin-add-row" id="batchAddRow">+ Add row</button></div></section></div><div class="admin-toast" id="adminToast"></div><div class="modal" id="deleteModal"><div class="modal__panel"><h2 class="modal__title">Delete this entry?</h2><p class="modal__sub" id="deleteModalMessage"></p><button type="button" class="btn btn--danger" id="deleteModalConfirmBtn">Delete entry</button> <button type="button" class="btn btn--ghost" id="deleteModalCancelBtn">Cancel</button></div></div><script type="module" src="js/admin-main.js"></script></body></html>
